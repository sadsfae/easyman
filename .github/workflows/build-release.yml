name: Build Release

on:
  push:
    branches:
      - main
    paths:
      - "Easyman/**"
      - "middlemand/**"
      - "allowed_emu.txt"
      - "tools/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "Easyman/**"
      - "middlemand/**"
      - "allowed_emu.txt"
      - "tools/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version tag
        id: version
        shell: bash
        run: |
          TAG="v0.1.$(git rev-list --count HEAD)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Easyman/Easyman.csproj

      - name: Publish
        run: >
          dotnet publish Easyman/Easyman.csproj
          -c Release
          -r win-x64
          --self-contained
          -p:PublishSingleFile=true
          -o ./publish

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc make

      - name: Build middleman
        shell: msys2 {0}
        run: |
          cd middlemand
          make

      - name: Copy middleman and config
        run: |
          Copy-Item middlemand/bin/middleman.exe ./publish/middleman.exe
          Copy-Item allowed_emu.txt ./publish/allowed_emu.txt

      - name: Package release zip
        run: Compress-Archive -Path ./publish/Easyman.exe, ./publish/middleman.exe, ./publish/allowed_emu.txt -DestinationPath ./Easyman-${{ steps.version.outputs.tag }}.zip

      - name: Stage SFX payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item publish\Easyman.exe, publish\middleman.exe, publish\allowed_emu.txt, tools\run-setup.cmd, tools\setup-easyman.ps1 staging\
          Get-ChildItem staging | Select-Object Name, Length

      - name: Build installer (IExpress)
        id: sfx
        shell: pwsh
        timeout-minutes: 10
        run: |
          $root = (Get-Location).Path
          $exeName = "Easyman-setup-${{ steps.version.outputs.tag }}.exe"
          $sed = @"
          [Version]
          Class=IEXPRESS
          SEDVersion=3
          [Options]
          PackagePurpose=InstallApp
          ShowInstallProgramWindow=1
          HideExtractAnimation=0
          UseLongFileName=1
          InsideCompressed=0
          CAB_FixedSize=0
          CAB_ResvCodeSigning=0
          RebootMode=N
          InstallPrompt=%InstallPrompt%
          DisplayLicense=%DisplayLicense%
          FinishMessage=%FinishMessage%
          TargetName=%TargetName%
          FriendlyName=%FriendlyName%
          AppLaunched=%AppLaunched%
          PostInstallCmd=%PostInstallCmd%
          AdminQuietInstCmd=%AdminQuietInstCmd%
          UserQuietInstCmd=%UserQuietInstCmd%
          SourceFiles=SourceFiles
          [Strings]
          InstallPrompt=
          DisplayLicense=
          FinishMessage=
          TargetName=$root\$exeName
          FriendlyName=Easyman
          AppLaunched=cmd.exe /c run-setup.cmd
          PostInstallCmd=<None>
          AdminQuietInstCmd=
          UserQuietInstCmd=
          FILE0="run-setup.cmd"
          FILE1="setup-easyman.ps1"
          FILE2="Easyman.exe"
          FILE3="middleman.exe"
          FILE4="allowed_emu.txt"
          [SourceFiles]
          SourceFiles0=$root\staging
          [SourceFiles0]
          %FILE0%=
          %FILE1%=
          %FILE2%=
          %FILE3%=
          %FILE4%=
          "@
          $sed | Out-File -FilePath config.sed -Encoding ascii
          # iexpress.exe is a GUI-subsystem app: PowerShell does not wait for it
          # when invoked directly, so launch it through Start-Process -Wait.
          $p = Start-Process -FilePath iexpress.exe -ArgumentList '/N','/Q','/M','config.sed' -Wait -PassThru
          Write-Host "iexpress exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "iexpress failed with exit code $($p.ExitCode)" }
          if (-not (Test-Path "$root\$exeName")) { throw "iexpress did not produce $exeName" }
          $zipName = "Easyman-${{ steps.version.outputs.tag }}.zip"
          $zipHash = (Get-FileHash "$root\$zipName" -Algorithm SHA256).Hash
          $exeHash = (Get-FileHash "$root\$exeName" -Algorithm SHA256).Hash
          "$zipHash  $zipName" | Out-File SHA256SUMS.txt -Encoding ascii
          "$exeHash  $exeName" | Out-File SHA256SUMS.txt -Encoding ascii -Append
          "sha256_zip=$zipHash" | Out-File $env:GITHUB_OUTPUT -Append
          "sha256_exe=$exeHash" | Out-File $env:GITHUB_OUTPUT -Append
          Get-Item "$root\$exeName", "$root\$zipName", "$root\SHA256SUMS.txt" | Select-Object Name, Length

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Easyman ${{ steps.version.outputs.tag }}
          files: |
            ./Easyman-${{ steps.version.outputs.tag }}.zip
            ./Easyman-setup-${{ steps.version.outputs.tag }}.exe
            ./SHA256SUMS.txt
          generate_release_notes: true
          make_latest: true
          body: |
            ## One-click installer (recommended)

            | | |
            | --- | --- |
            | Runs | `Easyman-setup-vX.X.X.exe` (IExpress self-extractor, built into Windows) |
            | Installs to | `%USERPROFILE%\easyman`, no admin rights needed |
            | Desktop | `Easyman` shortcut, Windows system Network icon (`shell32.dll,18`) |
            | Launch | Easyman opens automatically |
            | Re-run | Refreshes the install; any running Easyman/middleman is stopped first |

            The EXE is unsigned, so Windows SmartScreen warns once
            (More info > Run anyway). Verify the SHA-256 in
            `SHA256SUMS.txt` before running (zip:
            `${{ steps.sfx.outputs.sha256_zip }}`, installer EXE:
            `${{ steps.sfx.outputs.sha256_exe }}`).

            ## Portable zip (secondary)

            Download and extract `Easyman-vX.X.X.zip` to any folder. Both
            `Easyman.exe` and `middleman.exe` must be in the same folder,
            then run `Easyman.exe`. No install, no admin.

            ## First run

            1. Click **Browse** and locate your `eqhost.txt` in your EverQuest installation directory (one-time setup)
            2. Click **Enable Middleman** to start the login proxy
            3. Launch EverQuest and log in normally
            4. **Keep Easyman open** while you play (you can minimize it)
            5. When done, click **Disable Middleman** or close Easyman

            ## Windows SmartScreen

            On first run you may see "Windows protected your PC." This is normal for new applications:
            - Click **More info**
            - Click **Run anyway**

            ## Credits

            Middlemand by [@Zaela](https://github.com/Zaela), with the first
            Windows build by [@rm-you](https://github.com/rm-you).

            ---

